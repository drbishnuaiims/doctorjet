<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DoctorJet Drug Intelligence — Phase 2</title>

<style>
:root{
  --bg:#f4f7fa;
  --surface:#fff;
  --surface2:#f8fafc;
  --surface3:#f1f5f9;
  --border:#e2e8f0;
  --border2:#cbd5e1;
  --text:#172033;
  --muted:#64748b;
  --muted2:#94a3b8;
  --blue:#2563eb;
  --blueSoft:#eff6ff;
  --cyan:#0891b2;
  --green:#059669;
  --greenSoft:#ecfdf5;
  --amber:#d97706;
  --amberSoft:#fffbeb;
  --red:#dc2626;
  --redSoft:#fef2f2;
  --purple:#7c3aed;
  --purpleSoft:#f5f3ff;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 5px 18px rgba(15,23,42,.035);
  --shadow2:0 12px 35px rgba(15,23,42,.08);
  --radius:13px;
  --radius2:9px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Arial,sans-serif;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.5;
}

button,input,select{font:inherit}

button{cursor:pointer}

.app{
  min-height:100vh;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  height:70px;
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 23px;
  gap:20px;
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
}

.brand{
  flex:0 0 220px;
  width:220px;
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:10px;
  background:linear-gradient(145deg,#2563eb,#0891b2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
  font-weight:850;
  box-shadow:0 5px 14px rgba(37,99,235,.2);
}

.brand-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:-.025em;
  line-height:1.05;
}

.brand-subtitle{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.07em;
  margin-top:4px;
  font-weight:700;
}

.search-wrap{
  position:relative;
  width:min(620px,55vw);
}

.search{
  height:42px;
  width:100%;
  border:1px solid var(--border);
  border-radius:11px;
  background:#f8fafc;
  padding:0 90px 0 41px;
  outline:none;
  color:var(--text);
  transition:.18s;
}

.search:focus{
  background:#fff;
  border-color:#93c5fd;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.search-icon{
  position:absolute;
  left:14px;
  top:12px;
  color:var(--muted2);
  pointer-events:none;
}

.search-key{
  position:absolute;
  right:9px;
  top:8px;
  height:26px;
  padding:0 7px;
  border:1px solid var(--border);
  border-radius:6px;
  background:#fff;
  color:var(--muted);
  font-size:10px;
}

.search-results{
  position:absolute;
  left:0;
  right:0;
  top:50px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow2);
  overflow:hidden;
  display:none;
  z-index:300;
}

.search-results.show{display:block}

.result{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #f1f5f9;
  cursor:pointer;
}

.result:last-child{border-bottom:0}

.result:hover{background:#f8fafc}

.result-icon{
  width:33px;
  height:33px;
  border-radius:9px;
  background:var(--blueSoft);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:850;
}

.result-main{
  flex:1;
  min-width:0;
}

.result-title{
  font-size:11px;
  font-weight:800;
}

.result-meta{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.result-tag{
  font-size:8px;
  color:var(--muted);
  background:var(--surface3);
  padding:4px 6px;
  border-radius:5px;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.top-btn{
  height:36px;
  padding:0 11px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  color:var(--muted);
  display:flex;
  gap:6px;
  align-items:center;
}

.top-btn:hover{
  color:var(--text);
  border-color:var(--border2);
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
  height:calc(100vh - 70px);
  display:grid;
  grid-template-columns:245px 355px minmax(0,1fr);
  overflow:hidden;
}

.pane{
  min-width:0;
  overflow:hidden;
  background:#fff;
}

.library-pane{
  border-right:1px solid var(--border);
  background:#fbfcfe;
}

.commercial-pane{
  border-right:1px solid var(--border);
}

.intelligence-pane{
  background:#f7f9fc;
  overflow-y:auto;
}

/* =========================================================
   LIBRARY
========================================================= */

.pane-head{
  padding:17px 15px 12px;
  border-bottom:1px solid var(--border);
}

.pane-head-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.pane-title{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:800;
}

.counter{
  min-width:23px;
  height:20px;
  padding:0 6px;
  border-radius:6px;
  background:var(--surface3);
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
}

.filters{
  padding:9px 10px;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:5px;
  overflow:auto;
}

.filter{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
  padding:5px 7px;
  color:var(--muted);
  font-size:9px;
}

.filter.active{
  background:var(--blueSoft);
  border-color:#bfdbfe;
  color:#1d4ed8;
}

.library-list{
  height:calc(100% - 105px);
  overflow-y:auto;
  padding:6px;
}

.drug-item{
  padding:11px 9px;
  border:1px solid transparent;
  border-radius:10px;
  margin-bottom:3px;
  cursor:pointer;
  transition:.15s;
}

.drug-item:hover{
  background:#f8fafc;
}

.drug-item.active{
  background:#eff6ff;
  border-color:#bfdbfe;
}

.drug-item-top{
  display:flex;
  align-items:flex-start;
  gap:7px;
}

.drug-item-name{
  flex:1;
  font-size:12px;
  font-weight:800;
}

.fav{
  color:#cbd5e1;
  font-size:13px;
}

.drug-item.active .fav{
  color:#2563eb;
}

.item-meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:7px;
}

.chip{
  padding:3px 6px;
  background:#f1f5f9;
  border-radius:5px;
  color:#64748b;
  font-size:8px;
}

.chip.blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.chip.purple{
  background:#ede9fe;
  color:#6d28d9;
}

/* =========================================================
   COMMERCIAL
========================================================= */

.commercial-head{
  padding:16px;
  border-bottom:1px solid var(--border);
}

.selected{
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:11px;
  background:var(--blueSoft);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:850;
}

.selected-name{
  font-size:14px;
  font-weight:850;
}

.selected-meta{
  font-size:9px;
  color:var(--muted);
  margin-top:3px;
}

.commercial-scroll{
  height:calc(100% - 75px);
  overflow-y:auto;
}

.commercial-summary{
  padding:12px;
  border-bottom:1px solid var(--border);
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.summary-card{
  border:1px solid var(--border);
  background:#fbfcfe;
  border-radius:8px;
  padding:8px;
}

.summary-label{
  color:var(--muted);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.055em;
}

.summary-value{
  margin-top:3px;
  font-size:10px;
  font-weight:800;
}

.section-heading{
  padding:13px 14px 7px;
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.075em;
  font-weight:800;
}

.brand-list{
  padding:0 10px 20px;
}

.brand-card{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-bottom:7px;
  background:#fff;
}

.brand-card:hover{
  border-color:var(--border2);
}

.brand-top{
  display:flex;
  gap:7px;
}

.brand-main{
  flex:1;
}

.brand-name{
  font-size:11px;
  font-weight:800;
}

.brand-composition{
  font-size:8px;
  color:var(--muted);
  margin-top:2px;
}

.manufacturer{
  font-size:9px;
  color:#475569;
  margin-top:5px;
}

.brand-price{
  text-align:right;
}

.price{
  font-size:11px;
  font-weight:850;
}

.demo{
  display:inline-block;
  margin-top:2px;
  padding:2px 4px;
  border-radius:4px;
  background:#fff7ed;
  color:#c2410c;
  font-size:7px;
  font-weight:750;
}

.brand-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  border-top:1px solid #f1f5f9;
  margin-top:8px;
  padding-top:8px;
}

.brand-detail{
  font-size:8px;
}

.brand-detail span{
  display:block;
  color:var(--muted2);
  margin-bottom:1px;
}

.source-line{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:var(--muted2);
  font-size:7px;
}

.source{
  padding:3px 5px;
  border-radius:4px;
  background:#f1f5f9;
}

/* =========================================================
   INTELLIGENCE
========================================================= */

.detail{
  max-width:1200px;
  margin:auto;
  padding:21px 23px 70px;
}

.hero{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:15px;
}

.hero-kicker{
  color:var(--blue);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-size:9px;
  font-weight:850;
}

.hero-title{
  margin:3px 0 2px;
  font-size:27px;
  line-height:1.1;
  letter-spacing:-.04em;
}

.hero-sub{
  font-size:11px;
  color:var(--muted);
}

.hero-chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}

.hero-chip{
  padding:4px 7px;
  border-radius:5px;
  border:1px solid var(--border);
  background:#fff;
  color:#475569;
  font-size:8px;
}

.hero-chip.primary{
  color:#1d4ed8;
  background:var(--blueSoft);
  border-color:#bfdbfe;
}

.hero-actions{
  display:flex;
  gap:6px;
}

.icon-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--muted);
}

.icon-btn:hover{
  color:var(--blue);
  border-color:#bfdbfe;
}

/* =========================================================
   CARDS
========================================================= */

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
}

.card-head{
  padding:13px 15px;
  border-bottom:1px solid #eef2f7;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.card-title{
  font-size:11px;
  font-weight:850;
}

.card-sub{
  font-size:8px;
  color:var(--muted);
  margin-top:2px;
}

.card-body{
  padding:14px 15px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

/* =========================================================
   FACT STRIP
========================================================= */

.fact{
  border:1px solid var(--border);
  background:#fbfcfe;
  border-radius:9px;
  padding:9px;
}

.fact-label{
  color:var(--muted);
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.fact-value{
  font-size:11px;
  font-weight:800;
  margin-top:3px;
}

/* =========================================================
   MECHANISM
========================================================= */

.flow{
  display:flex;
  align-items:center;
  gap:6px;
  overflow:auto;
}

.flow-node{
  min-width:120px;
  padding:9px;
  border:1px solid var(--border);
  background:#fbfcfe;
  border-radius:9px;
}

.flow-label{
  color:var(--muted2);
  text-transform:uppercase;
  letter-spacing:.05em;
  font-size:7px;
  font-weight:800;
}

.flow-value{
  font-size:9px;
  font-weight:800;
  margin-top:3px;
}

.arrow{
  color:#94a3b8;
  font-size:15px;
}

.explanation{
  color:#475569;
  font-size:10px;
  line-height:1.65;
  margin:12px 0 0;
}

.target-list{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.target{
  padding:5px 7px;
  border-radius:6px;
  background:var(--purpleSoft);
  border:1px solid #ddd6fe;
  color:#6d28d9;
  font-size:8px;
  font-weight:750;
}

/* =========================================================
   INDICATIONS
========================================================= */

.indication{
  display:grid;
  grid-template-columns:1.2fr 125px 1fr;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #f1f5f9;
}

.indication:last-child{
  border-bottom:0;
}

.ind-name{
  font-size:9px;
  font-weight:800;
}

.ind-role{
  font-size:8px;
  color:var(--muted);
}

.status{
  display:inline-flex;
  width:max-content;
  padding:4px 6px;
  border-radius:5px;
  font-size:7px;
  font-weight:800;
}

.status.approved{
  background:var(--greenSoft);
  color:#047857;
}

.status.evidence{
  background:var(--purpleSoft);
  color:#6d28d9;
}

.status.offlabel{
  background:var(--amberSoft);
  color:#b45309;
}

/* =========================================================
   DOSING
========================================================= */

.dose-bar{
  position:relative;
  margin:6px 3% 19px;
}

.dose-line{
  position:absolute;
  left:2%;
  right:2%;
  top:17px;
  height:4px;
  background:#dbeafe;
  border-radius:999px;
}

.dose-points{
  display:flex;
  justify-content:space-between;
  position:relative;
}

.dose-point{
  width:34%;
  text-align:center;
}

.point{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#2563eb;
  border:3px solid #dbeafe;
  margin:auto;
}

.dose-value{
  font-size:12px;
  font-weight:850;
  margin-top:5px;
}

.dose-label{
  font-size:7px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.06em;
}

.dose-table{
  width:100%;
  border-collapse:collapse;
}

.dose-table th,
.dose-table td{
  padding:7px 6px;
  border-bottom:1px solid #f1f5f9;
  text-align:left;
  font-size:8px;
  vertical-align:top;
}

.dose-table th{
  font-size:7px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.dose-table td:first-child{
  font-weight:800;
}

/* =========================================================
   PK
========================================================= */

.timeline{
  position:relative;
  margin:19px 6px 5px;
}

.timeline-line{
  position:absolute;
  left:5%;
  right:5%;
  top:8px;
  height:2px;
  background:#cbd5e1;
}

.timeline-items{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  position:relative;
}

.timeline-item{
  text-align:center;
}

.timeline-dot{
  width:9px;
  height:9px;
  margin:4px auto 7px;
  border-radius:50%;
  background:#2563eb;
  border:3px solid #dbeafe;
}

.timeline-title{
  font-size:8px;
  font-weight:800;
}

.timeline-value{
  font-size:7px;
  color:var(--muted);
  margin-top:2px;
}

/* =========================================================
   EFFECTS
========================================================= */

.effect{
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}

.effect-head{
  padding:7px 9px;
  background:#fbfcfe;
  border-bottom:1px solid var(--border);
  font-size:8px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.06em;
}

.effect-body{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:8px;
}

.effect-chip{
  padding:5px 6px;
  border-radius:5px;
  font-size:7px;
  border:1px solid var(--border);
}

.effect-chip.common{
  background:var(--blueSoft);
  color:#1d4ed8;
  border-color:#bfdbfe;
}

.effect-chip.important{
  background:var(--amberSoft);
  color:#92400e;
  border-color:#fde68a;
}

.effect-chip.serious{
  background:var(--redSoft);
  color:#b91c1c;
  border-color:#fecaca;
}

.effect-chip.rare{
  background:#f8fafc;
  color:#64748b;
}

/* =========================================================
   WARNINGS
========================================================= */

.warning{
  border-left:3px solid var(--amber);
  border-radius:7px;
  background:var(--amberSoft);
  padding:9px 10px;
  margin-bottom:6px;
}

.warning.red{
  border-left-color:var(--red);
  background:var(--redSoft);
}

.warning-title{
  font-size:8px;
  font-weight:850;
}

.warning-text{
  font-size:8px;
  color:#64748b;
  margin-top:2px;
}

/* =========================================================
   INTERACTIONS
========================================================= */

.interaction{
  display:grid;
  grid-template-columns:1fr 100px 1.3fr;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid #f1f5f9;
}

.interaction:last-child{border-bottom:0}

.interaction-name{
  font-size:8px;
  font-weight:850;
}

.interaction-type{
  width:max-content;
  padding:4px 6px;
  border-radius:5px;
  background:#f1f5f9;
  color:#64748b;
  font-size:7px;
}

.interaction-note{
  font-size:8px;
  color:#64748b;
}

/* =========================================================
   MONITORING
========================================================= */

.monitor{
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
}

.monitor-stage{
  color:var(--blue);
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:7px;
  font-weight:850;
}

.monitor-name{
  font-size:9px;
  font-weight:800;
  margin-top:3px;
}

.monitor-note{
  font-size:8px;
  color:var(--muted);
  margin-top:3px;
}

/* =========================================================
   RATIONALE
========================================================= */

.rationale{
  display:flex;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #f1f5f9;
}

.rationale:last-child{border-bottom:0}

.rationale-number{
  width:23px;
  height:23px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--blueSoft);
  color:var(--blue);
  font-size:8px;
  font-weight:850;
  flex:0 0 23px;
}

.rationale-text{
  font-size:9px;
  color:#475569;
}

/* =========================================================
   PEARLS
========================================================= */

.pearl{
  padding:9px 10px 9px 29px;
  border:1px solid #dbeafe;
  border-radius:8px;
  background:#f8fbff;
  margin-bottom:6px;
  position:relative;
  font-size:9px;

/* =========================================================
   VALIDATION LAYER
========================================================= */

function validateDatabase(){

  const errors=[];

  Object.values(MOLECULES).forEach(drug => {

    if(!drug.id)
      errors.push("Molecule missing id");

    if(!drug.name)
      errors.push(`${drug.id}: missing name`);

    if(!FORMULATIONS[drug.id])
      errors.push(`${drug.id}: missing formulation`);

    if(!PHARMACOLOGY[drug.id])
      errors.push(`${drug.id}: missing pharmacology`);

    if(!PHARMACOKINETICS[drug.id])
      errors.push(`${drug.id}: missing PK`);

    if(!REFERENCES)
      errors.push(`${drug.id}: references unavailable`);

  });

  BRANDS.forEach(brand => {

    if(!MOLECULES[brand.molecule_id])
      errors.push(
        `Brand ${brand.id}: invalid molecule_id`
      );

    if(!MANUFACTURERS[brand.manufacturer_id])
      errors.push(
        `Brand ${brand.id}: invalid manufacturer_id`
      );

  });

  return {
    valid:errors.length === 0,
    errors
  };

}


/* =========================================================
   SEARCH INDEX
========================================================= */

function buildSearchIndex(){

  return Object.values(MOLECULES).map(drug => {

    const brandTerms = getBrands(drug.id)
      .flatMap(brand => [
        brand.name,
        brand.composition,
        getManufacturer(brand.manufacturer_id)?.name || ""
      ]);

    const indicationTerms = getIndications(drug.id)
      .map(x => x.indication?.name || "");

    const formulation = getFormulation(drug.id);

    return {

      molecule_id:drug.id,

      terms:[
        drug.name,
        ...drug.synonyms,
        ...drug.aliases,
        ...drug.departments,
        ...drug.drugClasses,
        ...drug.therapeuticClasses,
        ...(formulation?.dosage_forms || []),
        ...(formulation?.strengths || []),
        ...brandTerms,
        ...indicationTerms
      ].map(normalize)

    };

  });

}

const SEARCH_INDEX = buildSearchIndex();


/* =========================================================
   SEARCH ENGINE
========================================================= */

function normalize(value){

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}

function scoreSearchRecord(record,query){

  const q=normalize(query);

  if(!q)
    return 0;

  const molecule=getMolecule(record.molecule_id);

  let score=0;

  record.terms.forEach(term => {

    if(term===q)
      score=Math.max(score,100);

    else if(term.startsWith(q))
      score=Math.max(score,90);

    else if(term.includes(q))
      score=Math.max(score,75);

    const words=term.split(/\s+/);

    if(words.some(word=>word.startsWith(q)))
      score=Math.max(score,65);

  });

  if(
    normalize(molecule.name)===q
  ){
    score=120;
  }

  return score;

}

function searchDrugs(query){

  if(!query.trim())
    return Object.values(MOLECULES);

  return SEARCH_INDEX
    .map(record => ({
      id:record.molecule_id,
      score:scoreSearchRecord(record,query)
    }))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .map(x=>getMolecule(x.id));

}


/* =========================================================
   FILTER
========================================================= */

function filterDrugs(filter){

  if(filter==="all")
    return Object.values(MOLECULES);

  return Object.values(MOLECULES).filter(drug =>
    drug.departments.includes(filter) ||
    drug.drugClasses.includes(filter) ||
    drug.therapeuticClasses.includes(filter)
  );

}

                color:#475569;

    </div>

}

      <div class="card-head">

          <div class="card-title">

          </div>

/* =========================================================
   REFERENCES
========================================================= */

function collectReferences(molecule){

  const ids=new Set();

  getIndications(molecule.id)
    .forEach(record =>
      (record.evidence_refs || [])
        .forEach(id=>ids.add(id))
    );

  getDosing(molecule.id)
    .forEach(record =>
      (record.source_refs || [])
        .forEach(id=>ids.add(id))
    );

  /*
   * Add general sources relevant to the drug.
   */
  ids.add(
    molecule.id==="escitalopram"
      ? "ref_escitalopram_label"
      : molecule.id==="sertraline"
      ? "ref_sertraline_label"
      : molecule.id==="fluoxetine"
      ? "ref_fluoxetine_label"
      : molecule.id==="olanzapine"
      ? "ref_olanzapine_label"
      : "ref_risperidone_label"
  );

  ids.add("ref_dailymed");

  return [...ids]
    .map(id=>REFERENCES[id])
    .filter(Boolean);

}

function renderReferences(molecule){

  const references=collectReferences(molecule);

  return `

    <div class="card" id="references">

      <div class="card-head">

        <div>
          <div class="card-title">
            Evidence & Sources
          </div>

          <div class="card-sub">
            Provenance is attached to structured clinical records
          </div>
        </div>

        <span class="hero-chip primary">
          ${references.length} sources
        </span>

      </div>

      <div class="card-body">

        ${references.map((ref,index)=>`

          <div class="reference">

            <div class="ref-number">
              ${index+1}
            </div>

            <div>

              <div class="ref-title">
                ${ref.title}
              </div>

              <div class="ref-meta">
                ${ref.type} · ${ref.year}
              </div>

            </div>

            <div class="tier">
              ${ref.tier}
            </div>

          </div>

        `).join("")}

        <div class="data-note">

          <strong>Evidence architecture:</strong>
          regulatory/official documents and authoritative guidelines
          should supply the primary clinical facts. Systematic reviews
          and high-quality primary literature should support evidence
          questions. Commercial sources should be restricted primarily
          to brand, pack, price and availability metadata.

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   MAIN DETAIL RENDER
========================================================= */

function renderDetails(molecule){

  const container=document.getElementById("detail");

  const formulation=getFormulation(molecule.id);

  const favourite=
    state.favourites.has(molecule.id);

  container.innerHTML=`

    <div class="hero">

      <div>

        <div class="hero-kicker">
          ${molecule.departments.join(" · ")}
        </div>

        <div class="hero-title">
          ${molecule.name}
        </div>

        <div class="hero-sub">
          ${molecule.drugClasses.join(" · ")}
        </div>

        <div class="hero-chips">

          ${molecule.therapeuticClasses.map(x=>`
            <span class="hero-chip primary">
              ${x}
            </span>
          `).join("")}

          ${(formulation?.dosage_forms || []).map(x=>`
            <span class="hero-chip">
              ${x}
            </span>
          `).join("")}

          ${(formulation?.routes || []).map(x=>`
            <span class="hero-chip">
              ${capitalize(x)}
            </span>
          `).join("")}

        </div>

      </div>

      <div class="hero-actions">

        <button
          class="icon-btn"
          id="favouriteButton"
          title="Favourite"
        >
          ${favourite ? "★":"☆"}
        </button>

        <button
          class="icon-btn"
          id="compareDrugButton"
          title="Add to comparison"
        >
          ⇄
        </button>

      </div>

    </div>


    ${renderMechanism(molecule)}

    ${renderIndications(molecule)}

    ${renderDosing(molecule)}

    ${renderPK(molecule)}

    ${renderAdverseEffects(molecule)}

    ${renderWarnings(molecule)}

    ${renderInteractions(molecule)}

    ${renderMonitoring(molecule)}

    ${renderSpecialPopulations(molecule)}

    ${renderRationale(molecule)}

    ${renderPearls(molecule)}

    ${renderReferences(molecule)}

  `;


  document
    .getElementById("favouriteButton")
    .addEventListener("click",()=>{
      toggleFavourite(molecule.id);
    });


  document
    .getElementById("compareDrugButton")
    .addEventListener("click",()=>{
      addToComparison(molecule.id);
    });

}


/* =========================================================
   SELECTION
========================================================= */

function selectDrug(id){

  const molecule=getMolecule(id);

  if(!molecule)
    return;

  state.selectedDrug=id;

  renderLibrary();
  renderCommercial(molecule);
  renderDetails(molecule);

  document.getElementById("intelligencePane")
    .scrollTop=0;

}


/* =========================================================
   FAVOURITES
========================================================= */

function toggleFavourite(id){

  if(state.favourites.has(id)){

    state.favourites.delete(id);
    showToast("Removed from favourites");

  }else{

    state.favourites.add(id);
    showToast("Added to favourites");

  }

  renderLibrary();
  renderDetails(getMolecule(state.selectedDrug));

}


/* =========================================================
   COMPARISON STATE
========================================================= */

function addToComparison(id){

  if(!state.comparison.includes(id)){

    if(state.comparison.length>=4){

      showToast(
        "Comparison workspace supports up to 4 medicines."
      );

      return;

    }

    state.comparison.push(id);

    showToast(
      `${getMolecule(id).name} added to comparison`
    );

  }else{

    state.comparison=
      state.comparison.filter(x=>x!==id);

    showToast(
      `${getMolecule(id).name} removed from comparison`
    );

  }

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function renderSearchResults(query){

  const box=document.getElementById("searchResults");

  if(!query.trim()){

    box.classList.remove("show");
    box.innerHTML="";

    return;

  }

  const results=searchDrugs(query).slice(0,7);

  if(!results.length){

    box.innerHTML=`
      <div class="empty">
        No matching medicine, brand, class or indication.
      </div>
    `;

    box.classList.add("show");

    return;

  }

  box.innerHTML=results.map(drug=>`

    <div
      class="result"
      data-result="${drug.id}"
    >

      <div class="result-icon">
        ${drug.name.slice(0,2).toUpperCase()}
      </div>

      <div class="result-main">

        <div class="result-title">
          ${drug.name}
        </div>

        <div class="result-meta">
          ${drug.drugClasses.join(" · ")}
        </div>

      </div>

      <div class="result-tag">
        Molecule
      </div>

    </div>

  `).join("");

  box.classList.add("show");

  box.querySelectorAll(".result")
    .forEach(item=>{

      item.addEventListener("click",()=>{

        const id=item.dataset.result;

        state.search="";
        document.getElementById("searchInput").value="";

        box.classList.remove("show");

        selectDrug(id);

      });

    });

}


/* =========================================================
   SEARCH EVENT
========================================================= */

document
  .getElementById("searchInput")
  .addEventListener("input",event=>{

    state.search=event.target.value;

    renderLibrary();
    renderSearchResults(state.search);

  });


document
  .getElementById("searchInput")
  .addEventListener("keydown",event=>{

    if(event.key==="Escape"){

      event.target.value="";
      state.search="";

      document
        .getElementById("searchResults")
        .classList.remove("show");

      renderLibrary();

    }

  });


document.addEventListener("click",event=>{

  const searchWrap=
    document.querySelector(".search-wrap");

  if(!searchWrap.contains(event.target)){

    document
      .getElementById("searchResults")
      .classList.remove("show");

  }

});


/* =========================================================
   FILTER EVENTS
========================================================= */

document
  .querySelectorAll(".filter")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document
        .querySelectorAll(".filter")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      state.filter=button.dataset.filter;
      state.search="";

      document.getElementById("searchInput").value="";

      renderLibrary();

    });

  });


/* =========================================================
   TOP ACTIONS
========================================================= */

document
  .getElementById("compareButton")
  .addEventListener("click",()=>{

    showToast(
      state.comparison.length
        ? `${state.comparison.length} medicine(s) selected for comparison`
        : "Add medicines using ⇄ to build a comparison"
    );

  });


document
  .getElementById("evidenceButton")
  .addEventListener("click",()=>{

    document
      .getElementById("references")
      ?.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  });


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener("keydown",event=>{

  if(
    (event.metaKey || event.ctrlKey) &&
    event.key.toLowerCase()==="k"
  ){

    event.preventDefault();

    document
      .getElementById("searchInput")
      .focus();

  }

});


/* =========================================================
   MOBILE NAV
========================================================= */

document
  .querySelectorAll(".mobile-tab")
  .forEach(tab=>{

    tab.addEventListener("click",()=>{

      document
        .querySelectorAll(".mobile-tab")
        .forEach(x=>x.classList.remove("active"));

      document
        .querySelectorAll(".pane")
        .forEach(x=>x.classList.remove("mobile-active"));

      tab.classList.add("active");

      document
        .getElementById(tab.dataset.pane)
        .classList.add("mobile-active");

    });

  });


/* =========================================================
   UTILITIES
========================================================= */

function capitalize(value){

  if(!value)
    return "";

  return value.charAt(0).toUpperCase()+value.slice(1);

}

let toastTimer;

function showToast(message){

  const toast=document.getElementById("toast");

  toast.textContent=message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   INITIALISATION
========================================================= */

function initialise(){

  const validation=validateDatabase();

  if(!validation.valid){

    console.error(
      "DoctorJet database validation errors:",
      validation.errors
    );

  }

  renderLibrary();

  const initial=getMolecule(state.selectedDrug);

  renderCommercial(initial);
  renderDetails(initial);

}

initialise();

</script>
