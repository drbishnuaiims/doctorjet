
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — DoctorJet</title>
    <meta name="description" content="The page you're looking for could not be found. Return to DoctorJet home.">
    <meta name="theme-color" content="#f5f5f7">

    <!-- DoctorJet favicon -->
    <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/apple-touch-icon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        /* =========================================
           DOCTORJET — MINIMAL 404 PAGE
        ========================================= */

        :root {
            color-scheme: light;

            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-strong: #0b0b0d;
            --muted: #6e6e73;
            --blue: #0071e3;
            --blue2: #0077ed;
            --cyan: #30d5c8;
            --line: rgba(0, 0, 0, 0.09);
            --surface: rgba(255, 255, 255, 0.72);
            --button-text: #ffffff;
            --glow-blue: rgba(0, 113, 227, 0.10);
            --glow-cyan: rgba(48, 213, 200, 0.09);
        }

        html[data-theme="dark"] {
            color-scheme: dark;

            --bg: #000000;
            --text: #f5f5f7;
            --text-strong: #ffffff;
            --muted: #a1a1a6;
            --blue: #2997ff;
            --blue2: #64b5ff;
            --cyan: #64d2ff;
            --line: rgba(255, 255, 255, 0.12);
            --surface: rgba(28, 28, 30, 0.72);
            --button-text: #ffffff;
            --glow-blue: rgba(41, 151, 255, 0.12);
            --glow-cyan: rgba(100, 210, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;

            display: flex;
            flex-direction: column;

            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        /* =========================================
           SUBTLE BACKGROUND
        ========================================= */

        .ambient {
            position: fixed;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        .ambient-blue {
            top: -250px;
            left: -170px;
            background: var(--glow-blue);
        }

        .ambient-cyan {
            right: -240px;
            bottom: -240px;
            background: var(--glow-cyan);
        }

        /* =========================================
           HEADER / BRAND
        ========================================= */

        .site-header {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 26px 6%;
        }

        .header-inner {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }

        .logo-image {
            display: block;
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .logo-wordmark {
            font-size: 17px;
            font-weight: 850;
            letter-spacing: -0.055em;
            line-height: 1;
            color: var(--text);
        }

        .logo-wordmark span {
            background: linear-gradient(
                110deg,
                var(--blue),
                var(--cyan)
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* =========================================
           MAIN 404 CONTENT
        ========================================= */

        .main {
            position: relative;
            z-index: 1;

            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 48px 24px 80px;
        }

        .error-content {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            text-align: center;

            animation: fade-up 0.7s ease both;
        }

        .error-code {
            margin: 0 0 20px;

            font-size: clamp(112px, 24vw, 190px);
            font-weight: 800;
            letter-spacing: -0.095em;
            line-height: 0.9;

            color: transparent;

            background: linear-gradient(
                135deg,
                var(--blue) 8%,
                #4d9eff 48%,
                var(--cyan) 100%
            );

            -webkit-background-clip: text;
            background-clip: text;

            user-select: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            margin-bottom: 18px;

            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;

            color: var(--muted);
        }

        .eyebrow-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue);
        }

        .error-title {
            max-width: 600px;
            margin: 0 auto 16px;

            color: var(--text-strong);

            font-size: clamp(30px, 5.5vw, 46px);
            font-weight: 750;
            letter-spacing: -0.055em;
            line-height: 1.12;
        }

        .error-description {
            max-width: 390px;
            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 15px;
            font-weight: 400;
            line-height: 1.75;
        }

        /* =========================================
           HOME BUTTON
        ========================================= */

        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            min-height: 49px;
            padding: 0 23px;

            border: 0;
            border-radius: 999px;

            color: var(--button-text);

            background: linear-gradient(
                110deg,
                var(--blue),
                var(--blue2) 55%,
                #16bfc2
            );

            box-shadow:
                0 8px 24px rgba(0, 113, 227, 0.18);

            font-size: 14px;
            font-weight: 650;
            letter-spacing: -0.01em;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .home-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 12px 30px rgba(0, 113, 227, 0.25);
            filter: saturate(1.08);
        }

        .home-button:active {
            transform: scale(0.98);
        }

        .home-button:focus-visible {
            outline: 3px solid var(--blue);
            outline-offset: 4px;
        }

        .button-arrow {
            display: inline-block;
            font-size: 17px;
            line-height: 1;
            transition: transform 0.2s ease;
        }

        .home-button:hover .button-arrow {
            transform: translateX(3px);
        }

        /* =========================================
           FOOTER
        ========================================= */

        .site-footer {
            position: relative;
            z-index: 1;

            width: 100%;
            padding: 20px 24px 26px;

            text-align: center;
        }

        .footer-line {
            width: 100%;
            max-width: 1240px;
            height: 1px;
            margin: 0 auto 20px;
            background: var(--line);
        }

        .footer-text {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.01em;
        }

        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {
            .site-header {
                padding: 21px 22px;
            }

            .logo-image {
                width: 33px;
                height: 33px;
            }

            .logo-wordmark {
                font-size: 16px;
            }

            .main {
                padding: 36px 22px 60px;
            }

            .error-code {
                margin-bottom: 23px;
            }

            .error-title {
                max-width: 340px;
            }

            .error-description {
                max-width: 330px;
                font-size: 14px;
            }

            .home-button {
                min-height: 48px;
                width: auto;
            }

            .site-footer {
                padding-bottom: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <!-- Ambient background -->
    <div class="ambient ambient-blue" aria-hidden="true"></div>
    <div class="ambient ambient-cyan" aria-hidden="true"></div>

    <!-- DoctorJet branding -->
    <header class="site-header">
        <div class="header-inner">
            <a href="./" class="logo" aria-label="DoctorJet home">
                <img
                    class="logo-image"
                    src="./assets/doctorjet_logo.png"
                    alt="DoctorJet logo"
                    width="36"
                    height="36"
                >

                <span class="logo-wordmark">
                    DOCTOR<span>JET</span>
                </span>
            </a>
        </div>
    </header>

    <!-- Error message -->
    <main class="main">
        <section class="error-content" aria-labelledby="error-title">
            <div class="error-code" aria-label="Error 404">404</div>

            <div class="eyebrow">
                <span class="eyebrow-dot" aria-hidden="true"></span>
                Page not found
            </div>

            <h1 class="error-title" id="error-title">
                Looks like you took a wrong turn.
            </h1>

            <p class="error-description">
                The page you're looking for doesn't exist
                or may have been moved. Let's get you back
                on track.
            </p>

            <a href="./" class="home-button">
                Return to Home
                <span class="button-arrow" aria-hidden="true">→</span>
            </a>
        </section>
    </main>

    <!-- Minimal footer -->
    <footer class="site-footer">
        <div class="footer-line"></div>
        <p class="footer-text">
            © <span id="current-year"></span> DoctorJet. All rights reserved.
        </p>
    </footer>

    <script>
        /* =========================================
           DOCTORJET 404 — JAVASCRIPT
        ========================================= */

        // Automatically update the copyright year.
        document.getElementById("current-year").textContent =
            new Date().getFullYear();

        // Respect a saved DoctorJet theme preference.
        // Otherwise, follow the visitor's system preference.
        (function () {
            const root = document.documentElement;
            const themeColor = document.querySelector(
                'meta[name="theme-color"]'
            );

            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem("doctorjet-theme");
            } catch (error) {
                // Storage may be unavailable; use system preference.
            }

            const systemPrefersDark =
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;

            const theme =
                savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : systemPrefersDark
                        ? "dark"
                        : "light";

            root.setAttribute("data-theme", theme);

            if (themeColor) {
                themeColor.setAttribute(
                    "content",
                    theme === "dark" ? "#000000" : "#f5f5f7"
                );
            }
        })();
    </script>
</body>
</html>
