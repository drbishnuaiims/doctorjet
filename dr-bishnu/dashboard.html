<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#075e54">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DoctorJet — Appointments</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --wa-green: #075e54;
      --wa-green-dark: #054c44;
      --wa-light-green: #25d366;
      --wa-chat: #efeae2;
      --wa-bubble: #ffffff;
      --wa-outgoing: #d9fdd3;
      --wa-text: #111b21;
      --wa-muted: #667781;
      --wa-border: #e9edef;
      --wa-blue: #53bdeb;
      --wa-orange: #ffb74d;
      --wa-red: #ea4335;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--wa-text);
      background: #d9dbd5;
    }

    body {
      min-height: 100vh;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* APP SHELL */
    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--wa-chat);
      box-shadow: 0 0 30px rgba(0,0,0,.16);
    }

    /* TOP BAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 72px;
      background: var(--wa-green);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
    }

    .doctor-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #128c7e;
      display: grid;
      place-items: center;
      flex: 0 0 46px;
      font-weight: 700;
      font-size: 17px;
      overflow: hidden;
    }

    .doctor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .topbar-info {
      min-width: 0;
      flex: 1;
    }

    .topbar-name {
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-status {
      margin-top: 2px;
      font-size: 12px;
      opacity: .85;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 21px;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,.12);
    }

    /* DASHBOARD SUMMARY */
    .summary {
      background: #fff;
      border-bottom: 1px solid var(--wa-border);
      padding: 14px 16px 12px;
    }

    .summary-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #3b4a54;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--wa-border);
      border-radius: 10px;
      padding: 9px 8px;
      background: #fff;
      min-width: 0;
    }

    .stat-number {
      font-size: 20px;
      line-height: 1.1;
      font-weight: 700;
    }

    .stat-label {
      margin-top: 4px;
      color: var(--wa-muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SEARCH / FILTERS */
    .controls {
      background: #fff;
      padding: 10px 16px;
      border-bottom: 1px solid var(--wa-border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search {
      width: 100%;
      height: 40px;
      border: 0;
      outline: 0;
      border-radius: 20px;
      background: #f0f2f5;
      padding: 0 14px 0 39px;
      color: var(--wa-text);
      font-size: 14px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 10px;
      color: #667781;
      font-size: 17px;
      pointer-events: none;
    }

    .filter {
      height: 40px;
      border: 0;
      border-radius: 20px;
      background: #f0f2f5;
      color: #3b4a54;
      padding: 0 12px;
      outline: none;
      min-width: 112px;
      font-size: 13px;
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      position: relative;
      padding: 18px 12px 35px;
      overflow: hidden;
      background-color: var(--wa-chat);
    }

    /* WhatsApp-like subtle doodle texture */
    .chat-area::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .34;
      background-image:
        radial-gradient(circle at 10px 10px, rgba(100,100,100,.09) 1px, transparent 1.5px),
        radial-gradient(circle at 45px 35px, rgba(100,100,100,.06) 1px, transparent 1.5px);
      background-size: 58px 58px, 76px 76px;
    }

    .chat-content {
      position: relative;
      max-width: 850px;
      margin: 0 auto;
    }

    .date-divider {
      display: flex;
      justify-content: center;
      margin: 2px 0 14px;
    }

    .date-divider span {
      background: #fff;
      color: #54656f;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11px;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
    }

    /* PATIENT BUBBLE */
    .message {
      display: flex;
      margin: 0 0 10px;
    }

    .message.incoming {
      justify-content: flex-start;
    }

    .bubble {
      width: min(720px, 94%);
      background: var(--wa-bubble);
      border-radius: 8px;
      padding: 10px 11px 9px;
      box-shadow: 0 1px 1px rgba(0,0,0,.10);
      position: relative;
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -7px;
      top: 0;
      width: 0;
      height: 0;
      border-top: 9px solid #fff;
      border-left: 9px solid transparent;
    }

    .patient-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .patient-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #dfe5e7;
      color: #54656f;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
      flex: 0 0 42px;
    }

    .patient-main {
      min-width: 0;
      flex: 1;
    }

    .patient-name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .patient-name {
      font-size: 16px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .patient-id {
      color: var(--wa-muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .patient-meta {
      color: #54656f;
      font-size: 12px;
      margin-top: 3px;
      line-height: 1.4;
    }

    .appointment-line {
      margin-top: 8px;
      padding: 8px 9px;
      background: #f5f6f6;
      border-radius: 6px;
      font-size: 12px;
      color: #344047;
    }

    .appointment-line strong {
      color: #111b21;
    }

    .reason {
      margin-top: 8px;
      color: #3b4a54;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notes {
      margin-top: 5px;
      color: #667781;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid #edf0f1;
    }

    .status-badge {
      border-radius: 12px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-confirmed {
      background: #d9fdd3;
      color: #1b5e20;
    }

    .status-completed {
      background: #e3f2fd;
      color: #1565c0;
    }

    .status-cancelled {
      background: #fde7e7;
      color: #b42318;
    }

    .status-noshow {
      background: #eceff1;
      color: #455a64;
    }

    .time {
      color: #667781;
      font-size: 10px;
      white-space: nowrap;
    }

    /* ACTIONS */
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 9px;
    }

    .action {
      min-height: 36px;
      border: 1px solid #d9dfe2;
      border-radius: 6px;
      background: #fff;
      color: #344047;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: .15s ease;
    }

    .action:hover {
      background: #f0f2f5;
    }

    .action.whatsapp {
      color: #128c7e;
      border-color: #b7dfd8;
    }

    .action.video {
      color: #087f8c;
      border-color: #b7dfe2;
    }

    .action.rx {
      color: #546e7a;
      border-color: #cfd8dc;
    }

    .action.confirm {
      color: #1b5e20;
      border-color: #b7dcb8;
      background: #f4fff2;
    }

    .action.cancel {
      color: #b42318;
      border-color: #efc0bc;
      background: #fff8f7;
    }

    .action:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* EMPTY / LOADING */
    .state {
      text-align: center;
      padding: 70px 20px;
      color: #667781;
    }

    .state-icon {
      font-size: 42px;
      margin-bottom: 10px;
      opacity: .75;
    }

    .state-title {
      font-size: 16px;
      font-weight: 600;
      color: #455a64;
    }

    .state-text {
      font-size: 13px;
      margin-top: 5px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #d8dddf;
      border-top-color: var(--wa-green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: #323739;
      color: #fff;
      padding: 10px 15px;
      border-radius: 7px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 100;
      max-width: calc(100vw - 30px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }


    /* =========================================================
       TRUE WHATSAPP MOBILE SCREEN
       ========================================================= */
    @media (max-width: 640px) {

      html,
      body {
        width: 100%;
        min-width: 100%;
        height: 100%;
        background: #efeae2;
        overflow-x: hidden;
      }

      body {
        min-height: 100dvh;
      }

      .app {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
        height: 100dvh;
        margin: 0;
        background: #efeae2;
        box-shadow: none;
        display: flex;
        overflow: hidden;
      }

      /* WhatsApp-style mobile header */
      .topbar {
        position: relative;
        flex: 0 0 60px;
        height: 60px;
        padding: 0 8px;
        gap: 9px;
        background: #075e54;
      }

      .doctor-avatar {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
        font-size: 14px;
      }

      .topbar-info {
        flex: 1;
        min-width: 0;
      }

      .topbar-name {
        font-size: 15px;
        line-height: 19px;
        font-weight: 600;
      }

      .topbar-status {
        margin-top: 0;
        font-size: 11px;
        line-height: 15px;
      }

      .top-actions {
        gap: 0;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        font-size: 21px;
      }

      /* Compact WhatsApp-like quick stats */
      .summary {
        flex: 0 0 auto;
        padding: 7px 8px 6px;
        border-bottom: 1px solid #d9dddf;
        background: #fff;
      }

      .summary-title {
        display: none;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }

      .stat {
        min-width: 0;
        padding: 6px 3px 5px;
        border: 0;
        border-radius: 6px;
        background: #f0f2f5;
        text-align: center;
      }

      .stat-number {
        font-size: 17px;
        line-height: 18px;
        font-weight: 700;
        color: #075e54;
      }

      .stat-label {
        margin-top: 2px;
        font-size: 9px;
        line-height: 11px;
        color: #667781;
      }

      /* WhatsApp search/filter strip */
      .controls {
        flex: 0 0 auto;
        padding: 7px 8px;
        gap: 6px;
        background: #fff;
        border-bottom: 1px solid #d9dddf;
      }

      .search-wrap {
        min-width: 0;
      }

      .search {
        height: 38px;
        border-radius: 19px;
        padding-left: 37px;
        padding-right: 10px;
        background: #f0f2f5;
        font-size: 13px;
      }

      .search-icon {
        left: 13px;
        top: 9px;
        font-size: 16px;
      }

      .filter {
        flex: 0 0 91px;
        min-width: 91px;
        width: 91px;
        height: 38px;
        padding: 0 7px;
        border-radius: 19px;
        background: #f0f2f5;
        font-size: 11px;
      }

      /* Actual phone-like WhatsApp chat viewport */
      .chat-area {
        flex: 1 1 auto;
        min-height: 0;
        padding: 10px 6px 20px;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background-color: #efeae2;
      }

      .chat-area::before {
        opacity: .27;
      }

      .chat-content {
        width: 100%;
        max-width: none;
        margin: 0;
      }

      .date-divider {
        margin: 2px 0 11px;
      }

      .date-divider span {
        padding: 4px 9px;
        border-radius: 6px;
        font-size: 10px;
      }

      /* WhatsApp incoming-message bubble */
      .message {
        width: 100%;
        margin: 0 0 7px;
      }

      .bubble {
        width: calc(100% - 6px);
        max-width: none;
        border-radius: 7px;
        padding: 8px 8px 7px;
        box-shadow: 0 1px 1px rgba(0,0,0,.13);
      }

      .bubble::before {
        left: -6px;
        border-top-width: 8px;
        border-left-width: 8px;
      }

      .patient-row {
        gap: 8px;
      }

      .patient-avatar {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 13px;
      }

      .patient-name-line {
        gap: 5px;
      }

      .patient-name {
        font-size: 14px;
        line-height: 18px;
      }

      .patient-id {
        font-size: 9px;
      }

      .patient-meta {
        margin-top: 1px;
        font-size: 11px;
        line-height: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .appointment-line {
        margin-top: 7px;
        padding: 7px 8px;
        border-radius: 5px;
        font-size: 11px;
        line-height: 15px;
      }

      .reason {
        margin-top: 7px;
        font-size: 12px;
        line-height: 16px;
      }

      .notes {
        margin-top: 4px;
        font-size: 11px;
        line-height: 15px;
      }

      .status-row {
        margin-top: 7px;
        padding-top: 6px;
      }

      .status-badge {
        padding: 4px 8px;
        font-size: 10px;
      }

      .time {
        font-size: 9px;
      }

      /* Compact mobile action buttons */
      .actions {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 7px;
      }

      .action {
        min-height: 34px;
        height: 34px;
        border-radius: 5px;
        padding: 0 3px;
        font-size: 10px;
        white-space: nowrap;
      }

      /* The status actions remain easy to tap */
      .actions + .actions .action {
        min-height: 32px;
        height: 32px;
        font-size: 10px;
      }

      .state {
        padding: 55px 18px;
      }

      .state-icon {
        font-size: 35px;
      }

      .state-title {
        font-size: 15px;
      }

      .state-text {
        font-size: 12px;
      }

      .toast {
        bottom: calc(18px + env(safe-area-inset-bottom));
        font-size: 12px;
      }
    }

    /* Very small phones */
    @media (max-width: 380px) {

      .topbar {
        height: 58px;
        flex-basis: 58px;
      }

      .doctor-avatar {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .topbar-name {
        font-size: 14px;
      }

      .topbar-status {
        font-size: 10px;
      }

      .summary {
        padding: 6px 6px 5px;
      }

      .stat-number {
        font-size: 16px;
      }

      .stat-label {
        font-size: 8px;
      }

      .controls {
        padding: 6px;
      }

      .filter {
        flex-basis: 82px;
        min-width: 82px;
        width: 82px;
      }

      .chat-area {
        padding-left: 5px;
        padding-right: 5px;
      }

      .bubble {
        width: calc(100% - 4px);
      }

      .patient-avatar {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .patient-name {
        font-size: 13px;
      }

      .patient-id {
        display: none;
      }

      .action {
        font-size: 9px;
      }
    }


    /* =========================================================
       APPOINTMENT DETAILS POPUP
       ========================================================= */
    .appointment-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.45);
    }

    .appointment-modal.show {
      display: flex;
    }

    .modal-sheet {
      width: min(560px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -5px 30px rgba(0,0,0,.22);
      animation: sheetUp .18s ease-out;
    }

    @keyframes sheetUp {
      from { transform: translateY(30px); opacity: .7; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      background: #075e54;
      color: #fff;
    }

    .modal-close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      font-size: 25px;
      line-height: 1;
      display: grid;
      place-items: center;
    }

    .modal-close:hover {
      background: rgba(255,255,255,.12);
    }

    .modal-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 50%;
      background: #128c7e;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .modal-title {
      min-width: 0;
      flex: 1;
    }

    .modal-patient-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-patient-status {
      margin-top: 2px;
      font-size: 11px;
      opacity: .85;
    }

    .modal-body {
      padding: 14px;
    }

    .detail-appointment {
      background: #f0f2f5;
      border-radius: 9px;
      padding: 11px 12px;
      margin-bottom: 12px;
    }

    .detail-date {
      font-size: 15px;
      font-weight: 700;
      color: #075e54;
    }

    .detail-mode {
      margin-top: 3px;
      color: #667781;
      font-size: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid #e5e8ea;
      border-radius: 9px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .detail-item {
      padding: 9px 10px;
      border-bottom: 1px solid #e5e8ea;
    }

    .detail-item:nth-child(odd) {
      border-right: 1px solid #e5e8ea;
    }

    .detail-item:nth-last-child(-n+2) {
      border-bottom: 0;
    }

    .detail-label {
      color: #667781;
      font-size: 10px;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .25px;
    }

    .detail-value {
      color: #111b21;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .detail-section {
      margin: 0 0 12px;
      padding: 10px 11px;
      background: #fafafa;
      border: 1px solid #edf0f1;
      border-radius: 8px;
    }

    .detail-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #54656f;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .detail-section-text {
      font-size: 13px;
      line-height: 1.5;
      color: #111b21;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .modal-action {
      min-height: 40px;
      border: 1px solid #d9dfe2;
      border-radius: 7px;
      background: #fff;
      color: #344047;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
    }

    .modal-action.whatsapp {
      color: #128c7e;
      border-color: #b7dfd8;
    }

    .modal-action.video {
      color: #087f8c;
      border-color: #b7dfe2;
    }

    .modal-action.rx {
      color: #546e7a;
    }

    .modal-action.confirm {
      color: #1b5e20;
      border-color: #b7dcb8;
      background: #f4fff2;
    }

    .modal-action.cancel {
      color: #b42318;
      border-color: #efc0bc;
      background: #fff8f7;
    }

    .modal-action.complete {
      color: #1565c0;
      border-color: #bbd7ee;
      background: #f5faff;
    }

    .modal-action:disabled {
      opacity: .55;
      cursor: wait;
    }

    .modal-footer {
      padding: 0 14px calc(14px + env(safe-area-inset-bottom));
    }

    .modal-close-bottom {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: #f0f2f5;
      color: #54656f;
      font-weight: 600;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .appointment-modal {
        align-items: flex-end;
      }

      .modal-sheet {
        width: 100%;
        max-height: 91dvh;
        border-radius: 15px 15px 0 0;
      }

      .modal-head {
        padding: 10px 10px;
      }

      .modal-body {
        padding: 11px;
      }

      .modal-avatar {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .modal-patient-name {
        font-size: 15px;
      }

      .detail-grid {
        grid-template-columns: 1fr 1fr;
      }

      .modal-actions {
        gap: 5px;
      }

      .modal-action {
        min-height: 39px;
        font-size: 11px;
      }

      .modal-footer {
        padding-left: 11px;
        padding-right: 11px;
      }
    }

    @media (max-width: 360px) {
      .modal-actions {
        grid-template-columns: repeat(2, 1fr);
      }
    }

  </style>
</head>

<body>

<div class="app">

  <!-- WHATSAPP HEADER -->
  <header class="topbar">
    <div class="doctor-avatar">
      <span id="avatarInitials">BS</span>
      <img id="doctorPhoto" src="../images/dr-bishnu.jpg" alt="">
    </div>

    <div class="topbar-info">
      <div class="topbar-name">Dr Bishnu Prasad Sahoo</div>
      <div class="topbar-status" id="topStatus">Appointment Dashboard</div>
    </div>

    <div class="top-actions">
      <button class="icon-btn" type="button" title="Refresh" onclick="loadAppointments(true)">↻</button>
    </div>
  </header>

  <!-- QUICK VIEW -->
  <section class="summary">
    <div class="summary-title">Appointments</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="countToday">0</div>
        <div class="stat-label">Today</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="countPending">0</div>
        <div class="stat-label">Pending</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="countConfirmed">0</div>
        <div class="stat-label">Confirmed</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="countTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
    </div>
  </section>

  <!-- SEARCH + FILTER -->
  <section class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search patient or phone"
        autocomplete="off"
        oninput="renderAppointments()"
      >
    </div>

    <select id="filterSelect" class="filter" onchange="renderAppointments()">
      <option value="all">All</option>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Completed">Completed</option>
      <option value="Cancelled">Cancelled</option>
      <option value="No Show">No Show</option>
    </select>
  </section>

  <!-- CHAT -->
  <main class="chat-area">
    <div class="chat-content" id="chatContent">

      <div class="state" id="loadingState">
        <div class="spinner"></div>
        <div class="state-title">Loading appointments</div>
        <div class="state-text">Connecting to DoctorJet</div>
      </div>

    </div>
  </main>

</div>


<!-- APPOINTMENT DETAILS POPUP -->
<div class="appointment-modal" id="appointmentModal" onclick="closeModalOnBackdrop(event)">
  <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalPatientName">

    <header class="modal-head">
      <button class="modal-close" type="button" onclick="closeAppointmentModal()" aria-label="Close">‹</button>

      <div class="modal-avatar" id="modalAvatar">P</div>

      <div class="modal-title">
        <div class="modal-patient-name" id="modalPatientName">Patient</div>
        <div class="modal-patient-status" id="modalPatientStatus">Appointment details</div>
      </div>
    </header>

    <div class="modal-body" id="modalBody"></div>

    <div class="modal-footer">
      <button class="modal-close-bottom" type="button" onclick="closeAppointmentModal()">
        Close
      </button>
    </div>

  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxv5lzQwlP17YApffDFK3VLPhk1KAlSFgmcZ-opLhc9oKPEr2cPg-dmjtR1qicy6_p1/exec";

  let appointments = [];

  /*
    ---------------------------------------------------------
    INITIALIZATION
    ---------------------------------------------------------
  */

  document.addEventListener("DOMContentLoaded", () => {
    loadAppointments(false);

    // Show doctor's image if it exists.
    const photo = document.getElementById("doctorPhoto");
    photo.onload = () => {
      photo.style.display = "block";
      document.getElementById("avatarInitials").style.display = "none";
    };
    photo.onerror = () => {
      photo.style.display = "none";
      document.getElementById("avatarInitials").style.display = "block";
    };
  });


  /*
    ---------------------------------------------------------
    LOAD APPOINTMENTS
    ---------------------------------------------------------
  */

  async function loadAppointments(showToast = false) {
    const chat = document.getElementById("chatContent");

    if (!showToast) {
      chat.innerHTML = `
        <div class="state">
          <div class="spinner"></div>
          <div class="state-title">Loading appointments</div>
          <div class="state-text">Connecting to DoctorJet</div>
        </div>
      `;
    }

    try {
      const response = await fetch(
        API_URL + "?action=getAppointments",
        {
          method: "GET",
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error("Server returned " + response.status);
      }

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.message || "Unable to load appointments");
      }

      appointments = normalizeAppointments(data.appointments || data.data || []);

      // Newest first
      appointments.sort((a, b) => {
        const da = new Date(a.createdAt || 0).getTime();
        const db = new Date(b.createdAt || 0).getTime();
        return db - da;
      });

      updateStats();
      renderAppointments();

      document.getElementById("topStatus").textContent =
        "Updated " + formatTime(new Date());

      if (showToast) {
        showToastMessage("Appointments refreshed");
      }

    } catch (error) {
      console.error(error);

      chat.innerHTML = `
        <div class="state">
          <div class="state-icon">⚠</div>
          <div class="state-title">Could not load appointments</div>
          <div class="state-text">${escapeHTML(error.message || "Connection error")}</div>
          <br>
          <button class="action" style="max-width:180px;margin:auto;" onclick="loadAppointments(false)">
            Try Again
          </button>
        </div>
      `;

      document.getElementById("topStatus").textContent = "Connection error";
    }
  }


  /*
    ---------------------------------------------------------
    NORMALIZE GOOGLE SHEET / APPS SCRIPT DATA
    ---------------------------------------------------------
  */

  function normalizeAppointments(list) {
    if (!Array.isArray(list)) return [];

    return list.map(item => ({
      appointmentId: getField(item, [
        "appointmentId", "Appointment ID", "appointment_id", "id"
      ]),
      createdAt: getField(item, [
        "createdAt", "Created At", "created_at"
      ]),
      patientName: getField(item, [
        "patientName", "Patient Name", "patient_name", "name"
      ]),
      age: getField(item, [
        "age", "Age", "patientAge", "Patient Age"
      ]),
      gender: getField(item, [
        "gender", "Gender", "patientGender", "Patient Gender"
      ]),
      phone: getField(item, [
        "phone", "Phone", "mobile", "Mobile", "phoneNumber", "Phone Number"
      ]),
      email: getField(item, [
        "email", "Email", "emailAddress", "Email Address"
      ]),

      // Support every likely date key returned by Apps Script / Sheets.
      appointmentDate: getField(item, [
        "appointmentDate",
        "Appointment Date",
        "appointment_date",
        "appointment_date_value",
        "date",
        "Date"
      ]),

      // Support every likely time key returned by Apps Script / Sheets.
      appointmentTime: getField(item, [
        "appointmentTime",
        "Appointment Time",
        "appointment_time",
        "time",
        "Time"
      ]),

      doctor: getField(item, [
        "doctor", "Doctor"
      ]) || "Dr Bishnu Prasad Sahoo",

      department: getField(item, [
        "department", "Department"
      ]) || "Psychiatry",

      consultationMode: getField(item, [
        "consultationMode", "Consultation Mode", "consultation_mode", "mode", "Mode"
      ]),

      reason: getField(item, [
        "reason", "Reason", "reasonForAppointment", "Reason for Appointment"
      ]),

      additionalNotes: getField(item, [
        "additionalNotes", "Additional Notes", "additional_notes", "notes", "Notes"
      ]),

      status: getField(item, [
        "status", "Status"
      ]) || "Pending",

      lastUpdated: getField(item, [
        "lastUpdated", "Last Updated", "last_updated"
      ])
    }));
  }


  function getField(item, keys) {
    for (const key of keys) {
      if (
        Object.prototype.hasOwnProperty.call(item, key) &&
        item[key] !== null &&
        item[key] !== undefined &&
        String(item[key]).trim() !== ""
      ) {
        return item[key];
      }
    }
    return "";
  }


  /*
    ---------------------------------------------------------
    QUICK STATS
    ---------------------------------------------------------
  */

  function updateStats() {
    const today = localDateISO(new Date());

    document.getElementById("countToday").textContent =
      appointments.filter(a => normalizeDate(a.appointmentDate) === today &&
        !["Cancelled", "Completed"].includes(a.status)).length;

    document.getElementById("countPending").textContent =
      appointments.filter(a => a.status === "Pending").length;

    document.getElementById("countConfirmed").textContent =
      appointments.filter(a => a.status === "Confirmed").length;

    document.getElementById("countTotal").textContent =
      appointments.filter(a => a.status !== "Cancelled").length;
  }


  /*
    ---------------------------------------------------------
    RENDER CHAT BUBBLES
    ---------------------------------------------------------
  */

  function renderAppointments() {
    const chat = document.getElementById("chatContent");
    const search = document.getElementById("searchInput").value.trim().toLowerCase();
    const filter = document.getElementById("filterSelect").value;

    let filtered = appointments.filter(a => {

      const matchesStatus =
        filter === "all" || a.status === filter;

      const haystack = [
        a.patientName,
        a.phone,
        a.email,
        a.appointmentId,
        a.reason
      ].join(" ").toLowerCase();

      const matchesSearch =
        !search || haystack.includes(search);

      return matchesStatus && matchesSearch;
    });

    if (!filtered.length) {
      chat.innerHTML = `
        <div class="state">
          <div class="state-icon">☵</div>
          <div class="state-title">No appointments found</div>
          <div class="state-text">
            ${search || filter !== "all"
              ? "Try changing your search or filter."
              : "New appointments will appear here."}
          </div>
        </div>
      `;
      return;
    }

    chat.innerHTML = `
      <div class="date-divider">
        <span>${filtered.length} appointment${filtered.length === 1 ? "" : "s"}</span>
      </div>
      ${filtered.map(renderAppointment).join("")}
    `;
  }


  function renderAppointment(a) {
    const initials = getInitials(a.patientName);
    const statusClass = getStatusClass(a.status);
    const phone = cleanPhone(a.phone);

    return `
      <article
        class="message incoming"
        onclick="openAppointmentModal('${escapeJS(a.appointmentId)}')"
        style="cursor:pointer;"
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter' || event.key===' ') { event.preventDefault(); openAppointmentModal('${escapeJS(a.appointmentId)}'); }"
        aria-label="Open appointment for ${escapeHTML(a.patientName || "Patient")}"
      >
        <div class="bubble">

          <div class="patient-row">
            <div class="patient-avatar">${escapeHTML(initials)}</div>

            <div class="patient-main">
              <div class="patient-name-line">
                <div class="patient-name">
                  ${escapeHTML(a.patientName || "Unnamed Patient")}
                </div>
              </div>

              <div class="patient-meta">
                ${escapeHTML(patientMeta(a))}
              </div>
            </div>

            <div class="time">
              ${escapeHTML(formatTime(a.createdAt))}
            </div>
          </div>

          <div class="appointment-line">
            <strong>${escapeHTML(formatDate(a.appointmentDate))}</strong>
            &nbsp;·&nbsp;
            <strong>${escapeHTML(formatTimeValue(a.appointmentTime))}</strong>
            &nbsp;·&nbsp;
            ${escapeHTML(a.consultationMode || "Consultation")}
          </div>

          <div class="status-row">
            <span class="status-badge ${statusClass}">
              ${escapeHTML(a.status)}
            </span>

            <span class="time">Tap for details</span>
          </div>

        </div>
      </article>
    `;
  }


  /*
    ---------------------------------------------------------
    APPOINTMENT DETAILS POPUP
    ---------------------------------------------------------
  */

  function openAppointmentModal(appointmentId) {
    const appointment = appointments.find(
      a => String(a.appointmentId) === String(appointmentId)
    );

    if (!appointment) return;

    const modal = document.getElementById("appointmentModal");

    document.getElementById("modalAvatar").textContent =
      getInitials(appointment.patientName);

    document.getElementById("modalPatientName").textContent =
      appointment.patientName || "Unnamed Patient";

    document.getElementById("modalPatientStatus").textContent =
      `${appointment.status || "Pending"} · ${formatDate(appointment.appointmentDate)} · ${formatTimeValue(appointment.appointmentTime)}`;

    document.getElementById("modalBody").innerHTML =
      buildAppointmentDetails(appointment);

    modal.classList.add("show");
    document.body.style.overflow = "hidden";
  }


  function closeAppointmentModal() {
    const modal = document.getElementById("appointmentModal");

    modal.classList.remove("show");
    document.body.style.overflow = "";
  }


  function closeModalOnBackdrop(event) {
    if (event.target.id === "appointmentModal") {
      closeAppointmentModal();
    }
  }


  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeAppointmentModal();
    }
  });


  function buildAppointmentDetails(a) {
    const phone = cleanPhone(a.phone);

    const whatsappText =
      `Hello ${a.patientName}, this is Dr Bishnu Prasad Sahoo regarding your appointment on ${formatDate(a.appointmentDate)} at ${formatTimeValue(a.appointmentTime)}.`;

    const whatsappUrl = phone
      ? `https://wa.me/${phone}?text=${encodeURIComponent(whatsappText)}`
      : "#";

    const videoUrl = phone
      ? `https://wa.me/${phone}`
      : "#";

    const rxUrl =
      `../rx.html?patient=${encodeURIComponent(a.patientName)}`
      + `&age=${encodeURIComponent(a.age)}`
      + `&gender=${encodeURIComponent(a.gender)}`
      + `&phone=${encodeURIComponent(a.phone)}`
      + `&appointmentId=${encodeURIComponent(a.appointmentId)}`;

    const canConfirm = a.status === "Pending";
    const canCancel = !["Cancelled", "Completed"].includes(a.status);
    const canComplete = !["Cancelled", "Completed"].includes(a.status);

    return `
      <div class="detail-appointment">
        <div class="detail-date">
          ${escapeHTML(formatDate(a.appointmentDate))}
          ·
          ${escapeHTML(formatTimeValue(a.appointmentTime))}
        </div>

        <div class="detail-mode">
          ${escapeHTML(a.consultationMode || "Consultation")}
          · ${escapeHTML(a.department || "Psychiatry")}
        </div>
      </div>

      <div class="detail-grid">

        ${detailItem("Patient", a.patientName)}
        ${detailItem("Appointment ID", a.appointmentId)}
        ${detailItem("Age", a.age ? `${a.age} years` : "")}
        ${detailItem("Gender", a.gender)}
        ${detailItem("Phone", a.phone)}
        ${detailItem("Email", a.email)}
        ${detailItem("Doctor", a.doctor)}
        ${detailItem("Status", a.status)}
        ${detailItem("Created", formatDateTime(a.createdAt))}
        ${detailItem("Last Updated", formatDateTime(a.lastUpdated))}

      </div>

      ${a.reason ? `
        <div class="detail-section">
          <div class="detail-section-title">Reason for appointment</div>
          <div class="detail-section-text">${escapeHTML(a.reason)}</div>
        </div>
      ` : ""}

      ${a.additionalNotes ? `
        <div class="detail-section">
          <div class="detail-section-title">Additional notes</div>
          <div class="detail-section-text">${escapeHTML(a.additionalNotes)}</div>
        </div>
      ` : ""}

      <div class="modal-actions">

        <a
          class="modal-action whatsapp"
          href="${whatsappUrl}"
          target="_blank"
          rel="noopener"
          ${phone ? "" : 'aria-disabled="true"'}
        >
          WhatsApp
        </a>

        <a
          class="modal-action video"
          href="${videoUrl}"
          target="_blank"
          rel="noopener"
          ${phone ? "" : 'aria-disabled="true"'}
        >
          Video
        </a>

        <a
          class="modal-action rx"
          href="${rxUrl}"
          target="_blank"
          rel="noopener"
        >
          Prescription
        </a>

      </div>

      <div class="modal-actions">

        ${canConfirm ? `
          <button
            class="modal-action confirm"
            onclick="changeStatusFromModal('${escapeJS(a.appointmentId)}', 'Confirmed', this)"
          >
            ✓ Confirm
          </button>
        ` : `
          <div></div>
        `}

        ${canCancel ? `
          <button
            class="modal-action cancel"
            onclick="changeStatusFromModal('${escapeJS(a.appointmentId)}', 'Cancelled', this)"
          >
            × Cancel
          </button>
        ` : `
          <div></div>
        `}

        ${canComplete ? `
          <button
            class="modal-action complete"
            onclick="changeStatusFromModal('${escapeJS(a.appointmentId)}', 'Completed', this)"
          >
            ✓ Complete
          </button>
        ` : `
          <div></div>
        `}

      </div>
    `;
  }


  function detailItem(label, value) {
    return `
      <div class="detail-item">
        <div class="detail-label">${escapeHTML(label)}</div>
        <div class="detail-value">${escapeHTML(value || "—")}</div>
      </div>
    `;
  }


  function formatDateTime(value) {
    if (!value) return "—";

    const d = new Date(value);

    if (isNaN(d.getTime())) {
      return String(value);
    }

    return d.toLocaleString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });
  }


  async function changeStatusFromModal(appointmentId, status, button) {
    const appointment = appointments.find(
      a => String(a.appointmentId) === String(appointmentId)
    );

    if (!appointment) return;

    if (status === "Cancelled") {
      const ok = confirm(
        `Cancel appointment for ${appointment.patientName}?`
      );

      if (!ok) return;
    }

    const originalText = button.innerHTML;

    button.disabled = true;
    button.innerHTML = "Updating…";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "updateAppointment",
          appointmentId: appointmentId,
          status: status
        })
      });

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.message || "Unable to update appointment");
      }

      appointment.status = status;
      appointment.lastUpdated = new Date().toISOString();

      updateStats();
      renderAppointments();

      // Refresh the open popup with the updated status.
      openAppointmentModal(appointmentId);

      showToastMessage(`Appointment ${status.toLowerCase()}`);

    } catch (error) {
      console.error(error);

      button.disabled = false;
      button.innerHTML = originalText;

      showToastMessage(
        error.message || "Could not update appointment"
      );
    }
  }



  /*
    ---------------------------------------------------------
    UPDATE APPOINTMENT STATUS
    ---------------------------------------------------------
  */

  async function changeStatus(appointmentId, status, button) {

    const appointment = appointments.find(
      a => a.appointmentId === appointmentId
    );

    if (!appointment) return;

    if (status === "Cancelled") {
      const ok = confirm(
        `Cancel appointment for ${appointment.patientName}?`
      );

      if (!ok) return;
    }

    const originalText = button.innerHTML;
    button.disabled = true;
    button.innerHTML = "Updating…";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "updateAppointment",
          appointmentId: appointmentId,
          status: status
        })
      });

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.message || "Unable to update appointment");
      }

      appointment.status = status;
      appointment.lastUpdated = new Date().toISOString();

      updateStats();
      renderAppointments();

      showToastMessage(`Appointment ${status.toLowerCase()}`);

    } catch (error) {
      console.error(error);

      button.disabled = false;
      button.innerHTML = originalText;

      showToastMessage(
        error.message || "Could not update appointment"
      );
    }
  }


  /*
    ---------------------------------------------------------
    HELPERS
    ---------------------------------------------------------
  */

  function patientMeta(a) {
    const parts = [];

    if (a.age) parts.push(`${a.age} yrs`);
    if (a.gender) parts.push(a.gender);
    if (a.phone) parts.push(a.phone);

    return parts.join(" · ") || "Patient";
  }

  function getInitials(name) {
    const words = String(name || "").trim().split(/\s+/).filter(Boolean);

    if (!words.length) return "P";
    if (words.length === 1) return words[0].substring(0, 2).toUpperCase();

    return (
      words[0].charAt(0) +
      words[words.length - 1].charAt(0)
    ).toUpperCase();
  }

  function getStatusClass(status) {
    switch (String(status).toLowerCase()) {
      case "pending":
        return "status-pending";
      case "confirmed":
        return "status-confirmed";
      case "completed":
        return "status-completed";
      case "cancelled":
        return "status-cancelled";
      case "no show":
        return "status-noshow";
      default:
        return "status-pending";
    }
  }

  function cleanPhone(phone) {
    let p = String(phone || "").replace(/\D/g, "");

    // Indian 10-digit number
    if (p.length === 10) p = "91" + p;

    // Already country coded
    return p;
  }

  function normalizeDate(value) {
    if (value === null || value === undefined || value === "") return "";

    // Apps Script may return a Date object or an ISO string.
    if (Object.prototype.toString.call(value) === "[object Date]") {
      if (!isNaN(value.getTime())) return localDateISO(value);
    }

    const s = String(value).trim();

    // YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

    // YYYY-MM-DD with a time component
    const isoDate = s.match(/^(\d{4}-\d{2}-\d{2})[T ]/);
    if (isoDate) return isoDate[1];

    // DD/MM/YYYY or DD-MM-YYYY
    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) {
      return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
    }

    // MM/DD/YYYY
    const us = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (us) {
      const first = Number(us[1]);
      const second = Number(us[2]);
      if (first > 12 && second <= 12) {
        return `${us[3]}-${String(second).padStart(2, "0")}-${String(first).padStart(2, "0")}`;
      }
    }

    const d = new Date(s);

    if (isNaN(d.getTime())) return s;

    return localDateISO(d);
  }

  function localDateISO(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }

  function formatDate(value) {
    if (!value) return "Date not set";

    const normalized = normalizeDate(value);
    const d = new Date(normalized + "T00:00:00");

    if (isNaN(d.getTime())) return String(value);

    return d.toLocaleDateString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }

  function formatTimeValue(value) {
    if (value === null || value === undefined || value === "") {
      return "Time not set";
    }

    // Google Sheets can represent a time as a fraction of a day.
    if (typeof value === "number" && value >= 0 && value < 1) {
      const totalMinutes = Math.round(value * 24 * 60);
      let h = Math.floor(totalMinutes / 60) % 24;
      const min = String(totalMinutes % 60).padStart(2, "0");
      const suffix = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${min} ${suffix}`;
    }

    const s = String(value).trim();

    // HH:MM or HH:MM:SS
    const m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);

    if (m) {
      let h = Number(m[1]);
      const min = m[2];
      const suffix = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${min} ${suffix}`;
    }

    // ISO datetime or other browser-readable date/time value.
    const d = new Date(s);

    if (!isNaN(d.getTime())) {
      return d.toLocaleTimeString("en-IN", {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    return s;
  }

  function formatTime(value) {
    if (!value) return "";

    const d = new Date(value);

    if (isNaN(d.getTime())) return "";

    return d.toLocaleTimeString("en-IN", {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeJS(value) {
    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");
  }

  let toastTimer;

  function showToastMessage(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2600);
  }
</script>

</body>
